/* Testr: a late-night corner cafe.
   Dusk window with rain, walnut counter, paper order tickets, a loyalty stamp card for the streak. */

:root {
  --night: #261c2d;
  --night-2: #31243a;
  --night-3: #3d2e47;
  --walnut: #4b3329;
  --walnut-deep: #372620;
  --walnut-edge: #6a4a3a;
  --foam: #f5ead9;
  --latte: #cdbba6;
  --paper: #f4e8d0;
  --paper-edge: #d2bc98;
  --paper-warm: #fbf0d9;
  --ink: #3a2a22;
  --ink-soft: #6a5648;
  --amber: #f4b860;
  --amber-deep: #dc9334;
  --amber-ink: #7a4e0c;
  --rain: #86b8bb;
  --berry: #e07c92;
  --berry-ink: #9e3550;
  --matcha: #a5c98f;
  --matcha-ink: #3f6b2f;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Noto Serif", serif;
  --sans: "Avenir Next", Nunito, "Segoe UI", Roboto, system-ui, sans-serif;
  --wrap: 1160px;
}

* { box-sizing: border-box; }
html { font-size: 17px; -webkit-text-size-adjust: 100%; scroll-padding-top: 12px; }
body { margin: 0; background: var(--night); color: var(--foam); font-family: var(--sans); line-height: 1.5; min-height: 100vh; }
h1, h2, h3, p, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--amber); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.center { text-align: center; }

:focus-visible { outline: 3px solid var(--rain); outline-offset: 2px; }
.skip { position: absolute; left: 12px; top: -60px; background: var(--amber); color: var(--ink); padding: 8px 14px; border-radius: 8px; z-index: 50; }
.skip:focus { top: 12px; }

/* ---- the window ---------------------------------------------------------------- */
.window {
  position: relative; overflow: hidden;
  width: min(var(--wrap), calc(100% - 28px)); margin: 14px auto 0;
  border-radius: 18px 18px 6px 6px;
  background:
    radial-gradient(280px 150px at 6% 105%, rgba(244, 184, 96, 0.42), transparent 70%),
    linear-gradient(180deg, #2b2140 0%, #4a3358 50%, #8c5a72 100%);
  box-shadow: inset 0 0 0 9px var(--walnut-deep), inset 0 0 0 11px var(--walnut-edge), 0 14px 30px rgba(0, 0, 0, 0.35);
}
.window-inner { position: relative; z-index: 1; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 24px; padding: 46px 38px 24px; }
.brand { display: flex; align-items: center; gap: 14px; }
.brand-cup { color: var(--amber); display: grid; }
.brand-cup .cup { width: 40px; height: 40px; }
.wordmark { font-family: var(--serif); font-style: italic; font-weight: 600; font-size: 2.7rem; line-height: 1; letter-spacing: 0.01em; text-shadow: 0 2px 12px rgba(20, 10, 30, 0.55); }
.tagline { color: var(--latte); font-size: 0.95rem; margin-top: 4px; text-shadow: 0 1px 8px rgba(20, 10, 30, 0.6); }
.nav { display: flex; flex-wrap: wrap; gap: 6px; }
.nav a { display: inline-block; padding: 7px 16px; border-radius: 999px; color: var(--foam); text-decoration: none; font-weight: 600; background: rgba(36, 24, 40, 0.45); }
.nav a:hover { background: rgba(36, 24, 40, 0.7); }
.nav a[aria-current="page"] { background: var(--amber); color: var(--ink); }

.rain { position: absolute; inset: 0; pointer-events: none; }
.rain i { position: absolute; top: -30px; left: var(--x); width: 1px; height: var(--len); border-radius: 1px; background: linear-gradient(transparent, rgba(190, 220, 232, 0.8)); opacity: 0.7; animation: fall var(--t) linear var(--d) infinite; }
@keyframes fall { to { transform: translateY(260px); } }

/* ---- layout ----------------------------------------------------------------------- */
main { width: min(var(--wrap), calc(100% - 28px)); margin: 0 auto; padding: 0 0 90px; outline: none; }
.page { display: block; }
.page-head { padding: 26px 0 6px; }
.page-title { font-family: var(--serif); font-size: 2rem; font-weight: 600; }
.sub { color: var(--latte); font-size: 0.95rem; margin-top: 2px; }
.hint { color: var(--latte); font-size: 0.9rem; }
.link { color: var(--amber); font-weight: 600; }
h2 { font-family: var(--serif); font-size: 1.45rem; font-weight: 600; line-height: 1.2; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 28px; margin-top: 28px; align-items: start; }
.col-main > h2 { margin-bottom: 2px; }
.col-side { display: grid; gap: 18px; }
@media (max-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr); } .window-inner { padding: 22px 22px 18px; } .wordmark { font-size: 2.2rem; } }

/* ---- buttons and fields ------------------------------------------------------------ */
.btn { display: inline-block; font-weight: 700; line-height: 1.2; border: 0; border-radius: 999px; padding: 10px 20px; cursor: pointer; text-decoration: none; text-align: center; background: rgba(255, 255, 255, 0.12); color: var(--foam); }
.btn:hover { background: rgba(255, 255, 255, 0.2); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn--primary { background: var(--amber); color: var(--ink); box-shadow: 0 2px 0 var(--amber-deep); }
.btn--primary:hover { background: #f8c77f; }
.btn--big { padding: 12px 26px; font-size: 1.05rem; }
.btn--small { padding: 6px 14px; font-size: 0.9rem; }
.btn--quiet { background: transparent; box-shadow: inset 0 0 0 1.5px var(--latte); }
.btn--quiet:hover { background: rgba(255, 255, 255, 0.1); }
.btn--danger { background: transparent; color: var(--berry); box-shadow: inset 0 0 0 1.5px var(--berry); }
.btn--ink { background: var(--ink); color: var(--paper); }
.btn--ink:hover { background: #4d3a30; }
.btn--quiet-ink { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink-soft); }
.btn--quiet-ink:hover { background: rgba(58, 42, 34, 0.08); }

label { font-weight: 600; }
.field { display: grid; gap: 6px; align-content: start; }
.field-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 16px; }
.field--check { display: flex; align-items: center; gap: 10px; }
.field--check input { width: 20px; height: 20px; accent-color: var(--amber); }
.input, .select { width: 100%; background: #1b1320; border: 1.5px solid var(--walnut-edge); border-radius: 10px; padding: 10px 14px; color: var(--foam); }
.input::placeholder { color: #9d8c9f; }
.input--short { max-width: 120px; }
.input--paper { background: #fffaf0; border-color: var(--paper-edge); color: var(--ink); }
.input--paper::placeholder { color: #8d7a6a; }
.select { min-width: 220px; appearance: auto; }
.select--small { min-width: 0; padding: 8px 10px; }
.notes-text { font-family: var(--serif); line-height: 1.55; resize: vertical; }
.form-actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 8px; }
.photo-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 4px 0 6px; }

.panel { background: var(--night-2); border: 1px solid #473552; border-radius: 12px; padding: 18px 20px; margin-top: 20px; }
.col-side .panel { margin-top: 0; }
.panel > h2 { margin-bottom: 10px; font-size: 1.25rem; }

/* ---- the counter: Make a quiz ----------------------------------------------------------- */
.counter { width: 100%; background: linear-gradient(180deg, var(--walnut) 0, var(--walnut-deep) 100%); border-top: 3px solid var(--walnut-edge); border-radius: 0 0 14px 14px; padding: 20px 28px 22px; box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3); }
.counter-title { color: var(--foam); margin-bottom: 12px; }
.order-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 18px 22px; }
.order-row .field { min-width: 230px; flex: 0 1 280px; }
.counter .select { background: #2a1f25; }
.counter-hint { color: var(--latte); font-size: 0.9rem; margin-top: 12px; }
.order-empty { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; }
.levels { border: 0; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; max-width: 100%; min-inline-size: 0; }
.levels legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.level { position: relative; font-weight: 600; }
.level input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.level span { display: inline-block; padding: 10px 17px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px var(--walnut-edge); pointer-events: none; }
.level input:checked + span { background: var(--amber); color: var(--ink); box-shadow: none; }
.level input:focus-visible + span { outline: 3px solid var(--rain); outline-offset: 2px; }

/* ---- notices and empty states --------------------------------------------------------------- */
.notice { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; background: var(--night-2); border-left: 5px solid var(--rain); border-radius: 8px; padding: 14px 18px; margin-top: 20px; }
.notice--error { border-left-color: var(--berry); }
.notice-text p { color: var(--latte); font-size: 0.95rem; }
.notice-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.empty { border: 2px dashed #5a4656; border-radius: 12px; padding: 22px; margin-top: 14px; }
.empty-title { font-family: var(--serif); font-size: 1.15rem; }
.empty-text { color: var(--latte); margin-top: 4px; }
.empty-actions { margin-top: 12px; }

/* ---- order tickets ------------------------------------------------------------------------------ */
.tickets { display: grid; gap: 16px; margin-top: 16px; }
.ticket { --stub: 190px; position: relative; display: grid; grid-template-columns: minmax(0, 1fr) var(--stub); background: var(--paper); color: var(--ink); border-radius: 6px; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3); }
.ticket::before, .ticket::after { content: ""; position: absolute; right: calc(var(--stub) - 9px); width: 18px; height: 18px; border-radius: 50%; background: var(--night); }
.ticket::before { top: -9px; }
.ticket::after { bottom: -9px; }
.ticket-main { padding: 18px 22px; }
.ticket-title { font-family: var(--serif); font-size: 1.6rem; font-weight: 600; line-height: 1.15; }
.ticket-meta { color: var(--ink-soft); font-size: 0.9rem; margin-top: 2px; }
.ticket-note { margin-top: 10px; max-width: 52ch; }
.ticket-stub { border-left: 2px dashed var(--paper-edge); padding: 16px 14px; display: grid; gap: 12px; align-content: center; justify-items: center; text-align: center; }
.ticket-status { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--ink-soft); }
.ticket-status .cup { width: 22px; height: 22px; }
.ticket--ready .ticket-status { color: var(--amber-ink); }
.ticket--done .ticket-status { color: var(--matcha-ink); }
.ticket--error .ticket-status { color: var(--berry-ink); }
.ticket--brewing .ticket-status { color: var(--amber-ink); }
.ticket--empty, .ticket--idle { background: #e9dcc2; }
@media (max-width: 560px) {
  .ticket { grid-template-columns: minmax(0, 1fr); }
  .ticket::before, .ticket::after { display: none; }
  .ticket-stub { border-left: 0; border-top: 2px dashed var(--paper-edge); grid-auto-flow: column; justify-content: space-between; padding: 12px 18px; }
}

/* ---- stamp card, meters, lists -------------------------------------------------------------------- */
.stampcard { background: var(--paper); color: var(--ink); border-radius: 8px; padding: 18px 20px; border: 2px dashed var(--paper-edge); transform: rotate(-0.6deg); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.28); }
.stampcard h2 { font-size: 1.25rem; }
.streak-count { color: var(--ink-soft); font-weight: 600; margin: 2px 0 12px; }
.stamps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.stamp { aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; border: 2px dashed var(--paper-edge); color: var(--amber-deep); }
.stamp .cup { width: 70%; height: 70%; }
.stamp .steam { display: none; }
.stamp--done { border: 2px solid var(--amber-deep); background: var(--paper-warm); }
.stamp--open { border: 2px solid var(--rain); }
.stamp--missed { border: 2px solid var(--paper-edge); background: rgba(58, 42, 34, 0.06); }
.stampcard .hint { color: var(--ink-soft); margin-top: 12px; }

.meter { height: 9px; border-radius: 999px; background: var(--night-3); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 999px; background: var(--amber); }
.meter--hot > i { background: var(--berry); }
.panel .meter + .hint { margin-top: 8px; }
.weeklist { display: grid; gap: 6px; margin-bottom: 10px; font-size: 0.95rem; }
.weeklist li { padding: 4px 8px; border-radius: 6px; }
.weeklist li.is-today { background: rgba(244, 184, 96, 0.16); }
.avglist { display: grid; gap: 6px; }
.avglist li { display: flex; justify-content: space-between; gap: 12px; }

.history { margin-top: 36px; }
.rows { display: grid; margin-top: 12px; border-top: 1px solid #473552; }
.row { display: grid; grid-template-columns: 112px minmax(0, 1.2fr) 130px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 4px; border-bottom: 1px solid #473552; }
.row-date, .row-level { color: var(--latte); font-size: 0.92rem; }
.row-class { font-weight: 600; }
@media (max-width: 720px) { .row { grid-template-columns: 1fr auto; } .row-date, .row-level { grid-column: 1; } .row .btn { grid-column: 2; grid-row: 1 / span 2; } }

/* ---- notes ----------------------------------------------------------------------------------------------- */
.shelf { margin-top: 32px; }
.shelf-head, .class-head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.shelf-head { justify-content: space-between; margin-bottom: 8px; }
.class-group { margin-top: 22px; }
.class-head h3 { font-family: var(--serif); font-size: 1.3rem; font-weight: 600; }
.notelist { display: grid; gap: 12px; margin-top: 10px; }
.note { background: var(--night-2); border: 1px solid #473552; border-radius: 10px; padding: 14px 16px; display: grid; gap: 8px; }
.note-head { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
.note-snippet { color: var(--latte); font-family: var(--serif); white-space: pre-wrap; overflow-wrap: anywhere; }
.note-actions { display: flex; gap: 10px; }

/* ---- week ---------------------------------------------------------------------------------------------------- */
.weekgrid { display: grid; gap: 12px; margin: 14px 0 8px; }
.weekrow { display: grid; grid-template-columns: 110px 110px minmax(0, 1fr); gap: 12px; align-items: center; }
.weekday { font-family: var(--serif); font-size: 1.1rem; }
@media (max-width: 640px) { .weekrow { grid-template-columns: 1fr 1fr; } .weekrow .input { grid-column: 1 / -1; } }
.steps { list-style: decimal; padding-left: 22px; display: grid; gap: 6px; margin: 6px 0 18px; color: var(--latte); }
.status-line { font-weight: 600; }

/* ---- taking a quiz and results (paper sheet) -------------------------------------------------------------------- */
.page--quiz { padding-top: 6px; }
.quiz-bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 20px; background: var(--night); padding: 14px 4px 12px; border-bottom: 1px solid #473552; margin-bottom: 18px; }
.quiz-title { font-family: var(--serif); font-size: 1.7rem; font-weight: 600; }
.quiz-meta { display: flex; gap: 18px; font-weight: 700; color: var(--latte); }
.quiz-timer.is-over { color: var(--berry); }
.sheet { background: var(--paper); color: var(--ink); border-radius: 8px; padding: 28px clamp(18px, 4vw, 46px); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4); }
.sheet .sub, .sheet .hint { color: var(--ink-soft); }
.qlist { display: grid; gap: 28px; }
.qtext { font-family: var(--serif); font-size: 1.22rem; line-height: 1.4; margin-bottom: 12px; }
.qnum { font-weight: 700; color: var(--amber-ink); margin-right: 2px; }
.opts { display: grid; gap: 8px; }
.opts--row { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 420px; }
.opt { display: flex; gap: 12px; align-items: flex-start; padding: 11px 14px; border: 1.5px solid var(--paper-edge); border-radius: 8px; cursor: pointer; font-weight: 500; }
.opt:hover { background: var(--paper-warm); }
.opt input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--amber-deep); flex: none; }
.opt:has(input:checked) { border-color: var(--amber-deep); background: var(--paper-warm); }
.opt:has(input:focus-visible) { outline: 3px solid var(--rain); outline-offset: 2px; }
.quiz-submit { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
.quiz-status { color: var(--ink-soft); font-weight: 600; }
.page--quiz > .hint { margin-top: 16px; }

.score { margin-bottom: 22px; }
.score-line { font-family: var(--serif); font-size: 1.7rem; margin-top: 8px; }
.score-note { margin-top: 8px; max-width: 60ch; }
.score-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
.review { display: grid; gap: 16px; }
.rcard { background: var(--paper); color: var(--ink); border-radius: 8px; padding: 18px clamp(16px, 3vw, 28px); border-left: 7px solid var(--paper-edge); display: grid; gap: 8px; }
.rcard--ok { border-left-color: var(--matcha); }
.rcard--part { border-left-color: var(--amber); }
.rcard--no { border-left-color: var(--berry); }
.rcard .qtext { margin-bottom: 2px; }
.rhead { display: flex; flex-wrap: wrap; gap: 8px; }
.badge { display: inline-block; padding: 2px 11px; border-radius: 999px; font-weight: 700; font-size: 0.85rem; }
.badge--ok { background: #dcebcc; color: var(--matcha-ink); }
.badge--part { background: #f8e3b8; color: var(--amber-ink); }
.badge--no { background: #f6d6dc; color: var(--berry-ink); }
.badge--info { background: #d9e8ea; color: #2c5558; }
.ans-label { font-weight: 700; }
.why { background: rgba(58, 42, 34, 0.06); border-radius: 6px; padding: 8px 12px; }
.dispute { display: grid; gap: 8px; margin-top: 2px; justify-items: start; }
.dispute .input { justify-self: stretch; }
.dispute-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* ---- brewing pill and toasts -------------------------------------------------------------------------------------- */
.cup--steaming .steam { stroke-dasharray: 10; animation: steam 1.8s ease-in-out infinite; }
.cup--steaming .s2 { animation-delay: 0.3s; }
.cup--steaming .s3 { animation-delay: 0.6s; }
@keyframes steam { 0% { stroke-dashoffset: 10; opacity: 0; } 40% { opacity: 1; } 100% { stroke-dashoffset: -10; opacity: 0; } }
.cup:not(.cup--steaming) .steam { opacity: 0.75; }

.brew { position: fixed; left: 18px; bottom: 18px; z-index: 40; display: flex; gap: 12px; align-items: center; max-width: min(380px, calc(100% - 36px)); background: var(--walnut); border: 1px solid var(--walnut-edge); border-radius: 14px; padding: 12px 18px 12px 14px; box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45); color: var(--foam); }
.brew .cup { color: var(--amber); width: 34px; height: 34px; flex: none; }
.brew[hidden] { display: none; }
.brew-text { display: grid; gap: 1px; font-size: 0.92rem; }
.brew-text span { color: var(--latte); }

.toasts { position: fixed; right: 18px; bottom: 18px; z-index: 60; display: grid; gap: 10px; justify-items: end; max-width: min(440px, calc(100% - 36px)); }
.toast { display: flex; align-items: center; gap: 12px; background: #1a1220; border: 1px solid #4f3d5c; border-left: 5px solid var(--rain); border-radius: 10px; padding: 11px 12px 11px 16px; box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5); }
.toast--error { border-left-color: var(--berry); }
.toast-text { flex: 1; }
.toast-x { background: transparent; border: 0; color: var(--latte); font-size: 1.3rem; line-height: 1; cursor: pointer; padding: 2px 6px; }
@media (max-width: 640px) { .brew { bottom: 84px; } }

@media (prefers-reduced-motion: reduce) {
  .rain { display: none; }
  .cup--steaming .steam { animation: none; opacity: 1; }
  * { scroll-behavior: auto !important; }
}

/* ---- worker setup ---- */
.worker-code { margin: 4px 0 18px; }
.worker-code summary { cursor: pointer; font-weight: 600; color: var(--amber); }
.code-box { margin-top: 10px; font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; font-size: 0.8rem; line-height: 1.45; white-space: pre; overflow: auto; }

/* ---- confirm dialog ---- */
.modal-backdrop { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 20px; background: rgba(20, 12, 26, 0.72); }
.modal { width: min(440px, 100%); background: var(--paper); color: var(--ink); border-radius: 10px; padding: 24px 26px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55); }
.modal-text { font-family: var(--serif); font-size: 1.2rem; line-height: 1.4; }
.modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 22px; }
.modal .btn--quiet { color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink-soft); }
.modal .btn--danger { color: var(--berry-ink); box-shadow: inset 0 0 0 1.5px var(--berry-ink); }
.modal .btn--primary { color: var(--ink); }

/* ---- history and progress ---- */
.history-filter { max-width: 320px; margin: 14px 0 6px; }
.link--ink { display: inline-block; margin-top: 8px; color: var(--amber-ink); }
.overall { font-family: var(--serif); font-size: 1.3rem; }
.prog-list { display: grid; gap: 18px; }
.prog-head { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
.prog-row .hint { margin-top: 6px; }
.row--recent { grid-template-columns: 112px minmax(0, 1.2fr) minmax(0, 1fr) auto; }
@media (max-width: 720px) { .row--recent { grid-template-columns: 1fr auto; } .row--recent .row-score { grid-column: 1; } }

/* ---- "open in another tab" overlay ---- */
.takeover { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 20px; background: rgba(20, 12, 26, 0.9); }
.takeover-card { width: min(480px, 100%); background: var(--paper); color: var(--ink); border-radius: 10px; padding: 28px 30px; text-align: center; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55); display: grid; gap: 14px; justify-items: center; }
.takeover-card .cup { width: 44px; height: 44px; color: var(--amber-deep); }
.takeover-card h2 { font-size: 1.5rem; }
.takeover-msg { color: var(--berry-ink); font-weight: 600; min-height: 1.2em; }
.hint--alert { color: var(--berry); font-weight: 600; }

/* ---- days off ---- */
.off-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; margin: 10px 0 4px; }
.off-row .field { min-width: 200px; }
.off-row input[type=date] { color-scheme: dark; }
.offlist { display: grid; gap: 6px; margin-top: 12px; }
.offlist li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 6px 0; border-bottom: 1px solid #473552; }

/* ---- key-idea checklist on written answers ---- */
.checklist { display: grid; gap: 6px; margin: 2px 0 4px; }
.check { padding: 6px 10px; border-radius: 6px; background: rgba(58, 42, 34, 0.05); border-left: 4px solid var(--paper-edge); }
.check-label { display: inline-block; font-weight: 700; font-size: 0.85rem; margin-right: 6px; }
.check--covered { border-left-color: var(--matcha); }
.check--covered .check-label { color: var(--matcha-ink); }
.check--missing { border-left-color: var(--amber-deep); }
.check--missing .check-label { color: var(--amber-ink); }
.check--wrong { border-left-color: var(--berry); }
.check--wrong .check-label { color: var(--berry-ink); }
.check-quote { color: var(--ink-soft); font-style: italic; }

.account { display: none; align-items: center; gap: 10px; color: var(--foam); font-size: 0.9rem; }
body.has-account .account { display: flex; flex-wrap: wrap; }
.whoami { overflow-wrap: anywhere; }
body.gated #nav { display: none; }
.signin { max-width: 560px; }
.signin .field { margin-top: 14px; }
.signin .form-actions { margin-top: 16px; }
.signin .hint { margin-top: 14px; }

  <script>
// Runs before the app. If the app fails to start, this shows why instead of leaving a blank page.
(function () {
  var firstError = '';
  window.addEventListener('error', function (e) {
    if (!firstError) firstError = e && e.message ? String(e.message) : 'unknown error';
  });
  window.addEventListener('unhandledrejection', function (e) {
    if (!firstError) firstError = String((e.reason && e.reason.message) || e.reason || 'unknown error');
  });
  setTimeout(function () {
    if (window.__testrStarted && window.__testrRendered) return;
    var main = document.getElementById('main');
    if (!main) return;
    main.innerHTML = '';
    var box = document.createElement('div');
    box.className = 'notice notice--error';
    box.setAttribute('role', 'alert');
    var text = document.createElement('div');
    text.className = 'notice-text';
    var strong = document.createElement('strong');
    strong.textContent = 'Testr could not start.';
    var p = document.createElement('p');
    p.textContent = 'Try opening it again straight from the Files app in a normal Chrome tab, not in a preview.' + (firstError ? ' Details: ' + firstError : '');
    text.appendChild(strong);
    text.appendChild(p);
    box.appendChild(text);
    main.appendChild(box);
  }, 3000);
})();

  </script>
  <script>
(function () {
'use strict';
// ---- util.js ----
// Small helpers shared across the app. No dependencies.

/** Build a DOM element. Text is always added as text (never as HTML), so AI output is safe to show. */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  const late = [];
  for (const [k, v] of Object.entries(props || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'dataset') Object.assign(el.dataset, v);
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'selected') late.push([k, v]);
    else el.setAttribute(k, v === true ? '' : String(v));
  }
  append(el, kids);
  for (const [k, v] of late) el[k] = v;
  return el;
}

function append(el, kids) {
  for (const kid of kids) {
    if (kid === null || kid === undefined || kid === false) continue;
    if (Array.isArray(kid)) append(el, kid);
    else el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
}

/** Turn a trusted, hard-coded SVG string into an element. */
function svg(markup) {
  const t = document.createElement('template');
  t.innerHTML = markup.trim();
  return t.content.firstElementChild;
}

// ---- dates (all 'YYYY-MM-DD' strings in local time unless noted) -------------
const pad = (n) => String(n).padStart(2, '0');
const localDate = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDate = (s) => {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
};
const addDays = (s, n) => {
  const d = parseDate(s);
  d.setDate(d.getDate() + n);
  return localDate(d);
};

const WEEKDAYS = ['mon', 'tue', 'wed', 'thu', 'fri'];
const DAY_NAMES = { mon: 'Monday', tue: 'Tuesday', wed: 'Wednesday', thu: 'Thursday', fri: 'Friday' };

/** 'mon'..'fri' for a school day, or null on weekends. */
function weekdayKey(s) {
  const g = parseDate(s).getDay();
  return g >= 1 && g <= 5 ? WEEKDAYS[g - 1] : null;
}

/** The Monday that starts "this week". On Saturday and Sunday this is the coming Monday. */
function mondayOf(s) {
  const d = parseDate(s);
  const g = d.getDay();
  d.setDate(d.getDate() + (g === 0 ? 1 : g === 6 ? 2 : -(g - 1)));
  return localDate(d);
}

const utcDay = (d = new Date()) => d.toISOString().slice(0, 10);
const nextUtcMidnight = (d = new Date()) =>
  new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() + 1));

const fmtDay = (s) => parseDate(s).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
const fmtLongDay = (s) => parseDate(s).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
const fmtTime = (d) => d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
const fmtStamp = (ms) => new Date(ms).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

// ---- misc ------------------------------------------------------------------
const uid = (prefix = 'id') => `${prefix}_${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const cap = (s) => (s ? s[0].toUpperCase() + s.slice(1) : s);
const classKey = (name) => String(name || '').trim().toLowerCase().replace(/\s+/g, ' ');
const plural = (n, one, many = one + 's') => `${n} ${n === 1 ? one : many}`;
const clampInt = (v, lo, hi, fallback) => {
  const n = parseInt(v, 10);
  return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : fallback;
};
const fmtScore = (n) => (Number.isInteger(n) ? String(n) : n.toFixed(1));

function shuffle(list) {
  const a = [...list];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function debounce(fn, ms) {
  let t;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), ms);
  };
}

function download(filename, text, mime = 'text/plain') {
  const url = URL.createObjectURL(new Blob([text], { type: `${mime};charset=utf-8` }));
  const a = h('a', { href: url, download: filename });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

const readText = (file) =>
  new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result));
    r.onerror = () => reject(r.error);
    r.readAsText(file);
  });

// ---- nav.js ----
// Page-to-page navigation that does not depend on the web address.
// Preview panes and sandboxed frames block address changes, so Testr keeps track of the page itself
// and only updates the address bar when the browser allows it.
let render = () => {};
let shownHash = '';

const setRenderer = (fn) => {
  render = fn;
};
const currentHash = () => shownHash;
const readHash = () => {
  try {
    return location.hash || '';
  } catch {
    return '';
  }
};

/** Show a page, e.g. go('#/notes') or go('#/quiz/abc123'). */
function go(to, { replace = false } = {}) {
  const hash = String(to).startsWith('#') ? String(to) : '#' + to;
  if (hash === shownHash) return; // already on this page: redrawing it would erase anything typed but not saved
  shownHash = hash;
  try {
    if (replace) history.replaceState(null, '', hash);
    else history.pushState(null, '', hash);
  } catch {
    /* a preview may block this; the page still switches */
  }
  setTimeout(() => render(hash), 0);
}

/** The first page shown when Testr opens. */
function startNav(hash) {
  shownHash = hash;
  render(hash);
}

/** Back and forward buttons, or an edited address. */
function showFromBrowser() {
  const hash = readHash() || '#/today';
  if (hash === shownHash) return;
  shownHash = hash;
  render(hash);
}

// ---- sanitize.js ----
// Checks everything that comes in from a backup file or from storage before the app touches it.
// Fixes what can be fixed, sets aside what cannot, and counts both, so one damaged item can never
// take a whole page down. Pure functions: no page, no storage.

const isObj = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);
const str = (v, d = '') => (typeof v === 'string' ? v : d);
const num = (v, d = 0) => (typeof v === 'number' && Number.isFinite(v) ? v : d);
const bool = (v, d = false) => (typeof v === 'boolean' ? v : d);
const limitInt = (v, lo, hi, d) => (typeof v === 'number' && Number.isFinite(v) ? Math.min(hi, Math.max(lo, Math.round(v))) : d);
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const isDate = (v) => {
  if (typeof v !== 'string' || !DATE_RE.test(v)) return false;
  const [y, m, d] = v.split('-').map(Number);
  const t = new Date(y, m - 1, d);
  return t.getFullYear() === y && t.getMonth() === m - 1 && t.getDate() === d; // rejects 2026-02-30
};
const OK_LEVELS = ['easy', 'medium', 'hard'];
const OK_VERDICTS = ['correct', 'partial', 'incorrect'];
const OK_POINTS = { correct: 1, partial: 0.5, incorrect: 0 };
const OK_MAX_TEXT = 200000; // a single note or source text this large is certainly a mistake

function cleanDays(raw) {
  const out = {};
  for (const d of WEEKDAYS) {
    const row = isObj(raw) && isObj(raw[d]) ? raw[d] : {};
    const seen = new Set();
    const classes = (Array.isArray(row.classes) ? row.classes : [])
      .filter((c) => typeof c === 'string' && c.trim())
      .map((c) => c.trim().slice(0, 120))
      .filter((c) => !seen.has(c.toLowerCase()) && seen.add(c.toLowerCase()));
    out[d] = { label: row.label === 'A' || row.label === 'B' ? row.label : '', classes };
  }
  return out;
}

function cleanQuestion(raw, index, usedIds) {
  if (!isObj(raw)) return null;
  const question = str(raw.question).trim();
  if (question.length < 3) return null;
  let id = str(raw.id).trim();
  if (!id || usedIds.has(id)) id = `q${index + 1}x${usedIds.size}`;
  const base = { id, question, support: str(raw.support), explanation: str(raw.explanation) };
  if (raw.type === 'mcq') {
    const options = Array.isArray(raw.options) ? raw.options.map((o) => str(o).trim()) : [];
    if (options.length !== 4 || options.some((o) => !o)) return null;
    if (!Number.isInteger(raw.answerIndex) || raw.answerIndex < 0 || raw.answerIndex > 3) return null;
    return { ...base, type: 'mcq', options, answerIndex: raw.answerIndex };
  }
  if (raw.type === 'tf') {
    if (typeof raw.answer !== 'boolean') return null;
    return { ...base, type: 'tf', answer: raw.answer };
  }
  if (raw.type === 'short') {
    const answer = str(raw.answer).trim();
    if (!answer) return null;
    const keyPoints = (Array.isArray(raw.keyPoints) ? raw.keyPoints : []).filter((k) => typeof k === 'string' && k.trim()).slice(0, 5);
    return { ...base, type: 'short', answer, keyPoints: keyPoints.length ? keyPoints : [answer] };
  }
  return null;
}

/** A finished attempt is rebuilt from its per-question results, so the totals can never disagree with them. */
function cleanAttempt(raw, questions, createdAt) {
  if (!isObj(raw) || !isObj(raw.results)) return null;
  const results = {};
  for (const q of questions) {
    const r = isObj(raw.results[q.id]) ? raw.results[q.id] : {};
    const verdict = OK_VERDICTS.includes(r.verdict) ? r.verdict : 'incorrect';
    const points = typeof r.points === 'number' && r.points >= 0 && r.points <= 1 ? r.points : OK_POINTS[verdict];
    const checklist = (Array.isArray(r.checklist) ? r.checklist : [])
      .filter((c) => isObj(c) && typeof c.idea === 'string' && c.idea.trim() && ['covered', 'missing', 'wrong'].includes(c.status))
      .slice(0, 10)
      .map((c) => ({ idea: c.idea.trim().slice(0, 300), status: c.status, quote: str(c.quote).slice(0, 500) }));
    results[q.id] = {
      verdict,
      points,
      feedback: str(r.feedback),
      ...(checklist.length ? { checklist } : {}),
      ...(r.rechecked ? { rechecked: true } : {}),
      ...(r.overturned ? { overturned: true } : {}),
      ...(r.voided ? { voided: true } : {}),
      ...(r.disputed ? { disputed: true } : {}),
      ...(r.changed ? { changed: true } : {}),
    };
  }
  const total = questions.length;
  const score = questions.reduce((s, q) => s + results[q.id].points, 0);
  const answers = {};
  if (isObj(raw.answers)) {
    for (const q of questions) {
      const a = raw.answers[q.id];
      if (typeof a === 'number' || typeof a === 'boolean' || typeof a === 'string') answers[q.id] = a;
    }
  }
  return {
    results,
    answers,
    score,
    total,
    percent: total ? Math.round((score / total) * 100) : 0,
    completedAt: num(raw.completedAt, createdAt),
    seconds: Math.max(0, num(raw.seconds, 0)),
    rechecked: Math.max(0, limitInt(raw.rechecked, 0, 1000, 0)),
    overturned: Math.max(0, limitInt(raw.overturned, 0, 1000, 0)),
  };
}

/**
 * Returns { data, dropped, fixed }.
 *  data     a clean copy containing only the fields Testr knows about
 *  dropped  items that could not be used and were set aside
 *  fixed    items that were kept after repairing a value
 */
function sanitizeState(raw, defaults) {
  const report = { dropped: 0, fixed: 0 };
  const src = isObj(raw) ? raw : {};
  const bump = (what) => {
    report[what] += 1;
  };

  const s = isObj(src.settings) ? src.settings : {};
  const models = isObj(s.models) ? s.models : {};
  const settings = {
    difficulty: OK_LEVELS.includes(s.difficulty) ? s.difficulty : 'medium',
    count: limitInt(s.count, 5, 15, 10),
    timerOn: bool(s.timerOn, true),
    minutes: limitInt(s.minutes, 5, 60, 15),
    models: Object.fromEntries(Object.keys(defaults.models).map((k) => [k, typeof models[k] === 'string' && models[k].trim() ? models[k].trim() : defaults.models[k]])),
  };

  let schedule = null;
  if (isObj(src.schedule) && isDate(src.schedule.weekOf)) schedule = { weekOf: src.schedule.weekOf, days: cleanDays(src.schedule.days) };
  else if (src.schedule) bump('dropped');

  const scheduleLog = {};
  if (isObj(src.scheduleLog)) for (const [week, days] of Object.entries(src.scheduleLog)) if (isDate(week) && isObj(days)) scheduleLog[week] = cleanDays(days);

  const daysOff = Array.isArray(src.daysOff) ? [...new Set(src.daysOff.filter(isDate))].sort() : [];

  const noteIds = new Set();
  const notes = [];
  for (const n of Array.isArray(src.notes) ? src.notes : []) {
    const className = isObj(n) ? str(n.className).trim() : '';
    const text = isObj(n) ? str(n.text).slice(0, OK_MAX_TEXT) : '';
    if (!className || !text.trim()) {
      bump('dropped');
      continue;
    }
    let id = str(n.id).trim();
    if (!id || noteIds.has(id)) {
      id = uid('n');
      bump('fixed');
    }
    noteIds.add(id);
    notes.push({ id, className: className.slice(0, 120), title: str(n.title).slice(0, 300), text, source: n.source === 'photo' ? 'photo' : 'text', createdAt: num(n.createdAt, Date.now()) });
  }

  const quizIds = new Set();
  const quizzes = [];
  for (const q of Array.isArray(src.quizzes) ? src.quizzes : []) {
    const className = isObj(q) ? str(q.className).trim() : '';
    if (!isObj(q) || !className || !isDate(q.date)) {
      bump('dropped');
      continue;
    }
    const usedQ = new Set();
    const questions = [];
    (Array.isArray(q.questions) ? q.questions : []).forEach((rawQ, i) => {
      const cleaned = cleanQuestion(rawQ, i, usedQ);
      if (cleaned) {
        usedQ.add(cleaned.id);
        questions.push(cleaned);
      } else bump('dropped');
    });
    if (!questions.length) {
      bump('dropped');
      continue;
    }
    let id = str(q.id).trim();
    if (!id || quizIds.has(id)) {
      id = uid('quiz');
      bump('fixed');
    }
    quizIds.add(id);
    const createdAt = num(q.createdAt, Date.parse(`${q.date}T08:00:00`) || Date.now());
    let attempt = null;
    if (q.attempt) {
      attempt = cleanAttempt(q.attempt, questions, createdAt);
      if (!attempt) bump('fixed'); // damaged result: the quiz becomes available to take again
    }
    const draft = isObj(q.draft) && isObj(q.draft.answers) ? { answers: q.draft.answers, startedAt: num(q.draft.startedAt, createdAt) } : null;
    quizzes.push({
      id,
      date: q.date,
      className: className.slice(0, 120),
      kind: q.kind === 'daily' ? 'daily' : 'custom',
      difficulty: OK_LEVELS.includes(q.difficulty) ? q.difficulty : 'medium',
      createdAt,
      questions,
      unverified: bool(q.unverified),
      dropped: Math.max(0, limitInt(q.dropped, 0, 1000, 0)),
      sourceText: str(q.sourceText).slice(0, OK_MAX_TEXT),
      attempt,
      ...(draft && !attempt ? { draft } : {}),
    });
  }

  const u = isObj(src.usage) ? src.usage : {};
  const usage = { day: str(u.day), neurons: Math.max(0, num(u.neurons, 0)), ...(u.exhausted ? { exhausted: true } : {}) };

  return { data: { v: 1, settings, schedule, scheduleLog, daysOff, notes, quizzes, usage }, ...report };
}

// ---- store.js ----
// All of Testr's data lives in one object, `state`.
// Saved to data/testr-data.json when the launcher is running, otherwise to this browser (IndexedDB).


const DEFAULT_MODELS = {
  write: '@cf/meta/llama-3.3-70b-instruct-fp8-fast', // writes questions and grades first
  check: '@cf/meta/llama-3.3-70b-instruct-fp8-fast', // checks answer keys and takes the second look
  vision: '@cf/meta/llama-3.2-11b-vision-instruct', // reads photos of notes
};

const blank = () => ({
  v: 1,
  settings: { difficulty: 'medium', count: 10, timerOn: true, minutes: 15, models: { ...DEFAULT_MODELS } },
  schedule: null, // { weekOf: 'YYYY-MM-DD', days: { mon: { label: 'A', classes: [] }, ... } }
  scheduleLog: {}, // every week's schedule by Monday date, so past days can be judged fairly
  daysOff: [], // 'YYYY-MM-DD' holidays and sick days that never break the streak
  notes: [], // { id, className, title, text, source: 'photo'|'text', createdAt }
  quizzes: [], // see pipeline.js buildQuiz
  usage: { day: '', neurons: 0 },
});

const state = blank();
const env = { mode: 'account', canSave: true, readOnly: false, loadNotice: '', accountLocked: false, // mode: 'account' (web page, signed in) | 'extension' | 'server'
  serverConfigured: false, accountHint: '', loadError: '', saveError: '' };

const notifyChanged = () => window.dispatchEvent(new Event('testr:changed'));

/**
 * A "session" ends when the data is erased or replaced (or another tab takes over).
 * Work that started in an earlier session (a quiz being written, a request in flight) is cancelled
 * and must not save into the new data.
 */
const session = { epoch: 0, ctl: new AbortController() };
function invalidateSession() {
  session.epoch += 1;
  session.ctl.abort();
  session.ctl = new AbortController();
}

// ---- loading and saving ----------------------------------------------------
let modeKnown = false;
async function detectMode() {
  modeKnown = true;
  const inExtension = typeof chrome !== 'undefined' && chrome.runtime && chrome.runtime.id;
  if (inExtension) {
    env.mode = 'extension';
  } else {
    env.mode = 'account'; // a file or a web page: people sign in with a username and password, and AI requests go through the Testr server
  }
}

async function loadStore() {
  if (!modeKnown) await detectMode();
  try {
    const saved = env.mode === 'server' ? await serverGet() : env.mode === 'account' ? await accountGet() : await idbGet();
    if (saved && typeof saved === 'object' && saved.v) {
      const r = merge(saved);
      if (r.dropped || r.fixed) {
        env.loadNotice = repairSentence(r, 'Testr checked your saved data and');
        save(); // write the cleaned copy back so this is only reported once
      }
    }
  } catch (e) {
    console.warn('Could not load saved data', e);
    if (e && e.name === 'SyntaxError') env.loadError = 'Your saved data could not be read, so Testr started empty. A copy of the unreadable data was kept in this browser.';
    else env.canSave = false; // storage is blocked here (for example, inside a preview pane): work in memory
  }
}

/** Re-read the saved data (used when this tab takes over from another one). */
async function reloadStore() {
  try {
    const saved = env.mode === 'server' ? await serverGet() : await idbGet(dataKey());
    if (saved && typeof saved === 'object' && saved.v) merge(saved);
  } catch (e) {
    console.warn('Could not reload saved data', e);
  }
}

/** Check and load saved data. Returns how many items had to be set aside or repaired. */
const KEEP_SOURCE_DAYS = 60;

/** A taken quiz keeps a copy of the notes it came from for a while (so a second look can use them). After that the copy is dropped, so saved data does not grow without end. */
function pruneOldSource() {
  const cutoff = addDays(localDate(), -KEEP_SOURCE_DAYS);
  for (const q of state.quizzes) if (q.attempt && q.sourceText && q.date < cutoff) q.sourceText = '';
}

function merge(saved) {
  const { data, dropped, fixed } = sanitizeState(saved, { models: DEFAULT_MODELS });
  Object.assign(state, data);
  pruneOldSource();
  if (state.schedule && !state.scheduleLog[state.schedule.weekOf]) logSchedule();
  return { dropped, fixed };
}

/** Remember this week's schedule (the streak needs to know which past days had classes). */
function logSchedule() {
  const sch = state.schedule;
  if (sch && sch.weekOf && sch.days) state.scheduleLog[sch.weekOf] = JSON.parse(JSON.stringify(sch.days));
}

let saveTimer = null;
let writing = Promise.resolve();

/** Save soon: a write always lands within a quarter second, even during a burst of changes. */
function save() {
  if (saveTimer) return;
  saveTimer = setTimeout(flush, 250);
}

/** Save right now. Used for important moments (notes saved, quiz made, schedule saved). */
function flush() {
  clearTimeout(saveTimer);
  saveTimer = null;
  if (!env.canSave || env.readOnly) return Promise.resolve(); // read-only: another tab owns the data
  if (env.mode === 'account' && !auth.name) return Promise.resolve(); // nobody is signed in, so there is nowhere to save
  const snapshot = JSON.stringify(state);
  writing = writing
    .then(() => (env.mode === 'server' ? serverPut(snapshot) : idbPut(snapshot, dataKey())))
    .then(() => {
      if (env.saveError) {
        env.saveError = '';
        window.dispatchEvent(new Event('testr:save-ok'));
      }
    })
    .catch((e) => {
      console.warn('Save failed', e);
      env.saveError = 'Testr could not save your latest changes.';
      window.dispatchEvent(new Event('testr:save-error'));
    });
  return writing;
}

async function serverGet() {
  const r = await fetch('/api/data', { cache: 'no-store' });
  if (!r.ok) throw new Error('data ' + r.status);
  return r.json();
}
async function serverPut(snapshot) {
  const r = await fetch('/api/data', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: snapshot });
  if (!r.ok) throw new Error('save ' + r.status);
}

function idb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('testr', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('kv');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(key = 'data') {
  const db = await idb();
  return new Promise((resolve, reject) => {
    const q = db.transaction('kv').objectStore('kv').get(key);
    q.onsuccess = () => {
      try {
        resolve(q.result ? JSON.parse(q.result) : null);
      } catch (e) {
        idbStash(q.result).then(() => reject(e), () => reject(e)); // keep a copy of the unreadable data before anything can overwrite it
      }
    };
    q.onerror = () => reject(q.error);
  });
}
async function idbStash(raw) {
  const db = await idb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').put(raw, `corrupt-${Date.now()}`);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbPut(snapshot, key = 'data') {
  const db = await idb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').put(snapshot, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

/** Each signed-in person has their own saved copy, named by their username. */
const dataKey = () => {
  if (env.mode !== 'account') return 'data';
  if (!auth.name) throw new Error('Nobody is signed in.');
  return `data:${auth.name}`;
};

/** Load this person's data. Data saved before sign-in existed goes to the first person to sign in, once. */
async function accountGet() {
  const key = dataKey();
  const mine = await idbGet(key);
  if (mine) return mine;
  try {
    if (await idbGet('legacy-owner')) return null;
    const legacy = await idbGet('data');
    if (!legacy) return null;
    await idbPut(JSON.stringify(legacy), key);
    await idbPut(JSON.stringify(auth.name), 'legacy-owner');
    return legacy;
  } catch {
    return null; // unreadable old data is not handed to anyone
  }
}

// ---- classes and notes -----------------------------------------------------
function classNames() {
  const seen = new Map();
  const add = (n) => {
    const k = classKey(n);
    if (k && !seen.has(k)) seen.set(k, String(n).trim());
  };
  if (state.schedule) for (const d of WEEKDAYS) ((state.schedule.days || {})[d]?.classes || []).forEach(add);
  state.notes.forEach((n) => add(n.className));
  state.quizzes.forEach((q) => add(q.className));
  return [...seen.values()].sort((a, b) => a.localeCompare(b));
}

/** Reuse the spelling of a class we already know ("biology" becomes "Biology"). */
function canonicalName(name) {
  const k = classKey(name);
  return classNames().find((n) => classKey(n) === k) || String(name).trim();
}

const notesFor = (className) =>
  state.notes.filter((n) => classKey(n.className) === classKey(className)).sort((a, b) => b.createdAt - a.createdAt);

function addNote({ className, title, text, source }) {
  const note = { id: uid('n'), className: canonicalName(className), title: (title || '').trim(), text: text.trim(), source: source || 'text', createdAt: Date.now() };
  state.notes.push(note);
  flush();
  notifyChanged();
  return note;
}

function updateNote(id, patch) {
  const n = state.notes.find((x) => x.id === id);
  if (!n) return;
  Object.assign(n, patch);
  flush();
  notifyChanged();
}

function deleteNote(id) {
  state.notes = state.notes.filter((n) => n.id !== id);
  flush();
  notifyChanged();
}

function notesMarkdown(className = null) {
  const names = className ? [canonicalName(className)] : classNames();
  const parts = [];
  for (const name of names) {
    const list = notesFor(name).reverse();
    if (!list.length) continue;
    parts.push(`# ${name}\n`);
    for (const n of list) parts.push(`## ${n.title || 'Notes'} (${fmtStamp(n.createdAt)})\n\n${n.text}\n`);
  }
  return parts.join('\n') || '# Notes\n\nNo notes yet.\n';
}

// ---- quizzes and the daily tracker -----------------------------------------
const quizById = (id) => state.quizzes.find((q) => q.id === id);
const quizzesOn = (date, kind) => state.quizzes.filter((q) => q.date === date && (!kind || q.kind === kind));

/** The first day Testr was used for quizzes. Earlier days are never held against anyone. */
function firstQuizDate() {
  let first = null;
  for (const q of state.quizzes) if (typeof q.date === 'string' && (!first || q.date < first)) first = q.date;
  return first;
}

/**
 * What one day counts as for the streak:
 *  'skip'   weekend, a day off, or a school day with no classes on the schedule
 *  'before' earlier than the first quiz ever made (not counted either way)
 *  'done'   every daily quiz that day was finished (or, with none made, an extra quiz was)
 *  'open'   today, and not finished yet
 *  'missed' a school day that passed without the quizzes being finished
 */
function dayKind(date, today) {
  const wk = weekdayKey(date);
  if (!wk || state.daysOff.includes(date)) return 'skip';
  const logged = state.scheduleLog[mondayOf(date)];
  if (logged && logged[wk] && (logged[wk].classes || []).length === 0) return 'skip';
  const first = firstQuizDate();
  if (!first || date < first) return 'before';
  const daily = quizzesOn(date, 'daily');
  if (daily.length) return daily.every((q) => q.attempt) ? 'done' : date === today ? 'open' : 'missed';
  if (quizzesOn(date, 'custom').some((q) => q.attempt)) return 'done';
  if (!logged) return 'skip'; // no schedule was set for that week, so no quizzes could be made
  return date === today ? 'open' : 'missed';
}

/** School days in a row (Monday to Friday) with the quizzes finished. A missed school day breaks it. */
function streak(today) {
  let n = 0;
  for (let i = 0; i < 400; i++) {
    const kind = dayKind(addDays(today, -i), today);
    if (kind === 'skip' || kind === 'open') continue; // 'open' can only be today, which is still in progress
    if (kind === 'done') {
      n++;
      continue;
    }
    break; // missed, or we have gone back past the first day Testr was used
  }
  return n;
}

/** The last few school days, oldest first, for the stamp card. */
function stampDays(today, count = 10) {
  const out = [];
  for (let i = 0; i < 400 && out.length < count; i++) {
    const date = addDays(today, -i);
    const kind = dayKind(date, today);
    if (kind === 'before') break;
    if (kind !== 'skip') out.unshift({ date, label: fmtDay(date), status: kind });
  }
  return out;
}

function addDayOff(date) {
  if (!state.daysOff.includes(date)) state.daysOff = [...state.daysOff, date].sort();
  flush();
  notifyChanged();
}
function removeDayOff(date) {
  state.daysOff = state.daysOff.filter((d) => d !== date);
  flush();
  notifyChanged();
}

/** Average score per class over the last `days` days. */
function averages(today, days = 14) {
  const cutoff = addDays(today, -days);
  const by = new Map();
  for (const q of state.quizzes) {
    if (!q.attempt || q.date < cutoff) continue;
    const k = classKey(q.className);
    const row = by.get(k) || { name: q.className, sum: 0, n: 0 };
    row.sum += q.attempt.percent;
    row.n += 1;
    by.set(k, row);
  }
  return [...by.values()].map((r) => ({ name: r.name, percent: Math.round(r.sum / r.n), quizzes: r.n })).sort((a, b) => a.name.localeCompare(b.name));
}

// ---- backup ----------------------------------------------------------------
const exportJSON = () => JSON.stringify(state, null, 2);

/** Say what was set aside or repaired, in plain words. */
function repairSentence({ dropped, fixed }, lead = 'Testr') {
  const parts = [];
  if (dropped) parts.push(`set aside ${dropped} damaged ${dropped === 1 ? 'item' : 'items'} it could not use`);
  if (fixed) parts.push(`repaired ${fixed} ${fixed === 1 ? 'item' : 'items'}`);
  return `${lead} ${parts.join(' and ')}.`;
}

/** Reads a backup file's text and checks it is a Testr backup, without changing anything. */
function checkBackup(text) {
  let j;
  try {
    j = JSON.parse(text);
  } catch {
    throw new Error('That file could not be read. It is not a Testr backup.');
  }
  if (!j || typeof j !== 'object' || Array.isArray(j) || !Array.isArray(j.notes) || !Array.isArray(j.quizzes)) throw new Error('That file is not a Testr backup.');
  return j;
}

function importJSON(text) {
  return applyBackup(checkBackup(text));
}

function applyBackup(j) {
  invalidateSession();
  const report = merge(j);
  flush();
  window.dispatchEvent(new Event('testr:reset'));
  notifyChanged();
  return report;
}

function resetAll() {
  invalidateSession();
  Object.assign(state, blank());
  flush();
  window.dispatchEvent(new Event('testr:reset'));
  notifyChanged();
}

async function authPost(path, body, token, ms = 20000) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms);
  try {
    const res = await fetch(AUTH_URL + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) },
      body: JSON.stringify(body || {}),
      signal: ctl.signal,
    });
    let json = {};
    try {
      json = (await res.json()) || {};
    } catch {
      /* not JSON */
    }
    return { status: res.status, json };
  } catch {
    throw new AIError('network', 'Could not reach the sign-in server. Check your internet connection and try again.');
  } finally {
    clearTimeout(timer);
  }
}

    const status = h('p', { id: 'si-status', class: 'hint hint--alert', role: 'status', 'aria-live': 'polite', hidden: true });

    const form = h('form', { novalidate: true, onsubmit: (e) => { e.preventDefault(); submit(); } },
      h('div', { class: 'field' }, h('label', { for: 'si-user' }, 'Username'), userInput),
      h('div', { class: 'field' }, h('label', { for: 'si-pass' }, 'Password'), passInput),
      pass2Wrap,
      h('div', { class: 'field field--check' }, showBox, h('label', { for: 'si-show' }, 'Show password')),
      h('div', { class: 'form-actions' }, submitBtn, switchBtn),
      msg,
      rules,
    );
    const root = h('div', { class: 'page signin', id: 'signin' },
      h('div', { class: 'page-head' }, title, sub),
      h('section', { class: 'panel' }, status, form),
    );

    // Ask the server how it is, so a broken server is explained here instead of looking like a button that does nothing.
    checkServer().then((problem) => {
      status.textContent = problem;
      status.hidden = !problem;
    });

    function setMode(next) {
      mode = next;
      const signup = next === 'signup';
      pass2Wrap.hidden = !signup;
      title.textContent = signup ? 'Create an account' : 'Sign in';
      sub.textContent = signup ? 'Pick a username and a password. Your notes stay in this browser.' : 'Use your username and password. Your notes stay in this browser.';
      submitBtn.textContent = signup ? 'Create account' : 'Sign in';
      switchBtn.textContent = signup ? 'I already have an account' : 'I need to create an account';
      passInput.autocomplete = signup ? 'new-password' : 'current-password';
      rules.textContent = signup ? 'Usernames are 3 to 20 letters, numbers or underscores. Passwords need at least 8 characters.' : 'If you forget your password, ask your teacher.';
      say('');
    }

    async function submit() {
      if (busy) return;
      const name = userInput.value.trim().toLowerCase();
      const pass = passInput.value;
      if (!USERNAME_OK.test(name)) return say('Usernames are 3 to 20 letters, numbers or underscores.', true);
      if (!pass) return say('Enter your password.', true);
      if (mode === 'signup') {
        if (pass.length < 8) return say('Passwords need at least 8 characters.', true);
        if (pass !== pass2Input.value) return say('The two passwords do not match.', true);
      }
      busy = true;
      submitBtn.disabled = true;
      say(mode === 'signup' ? 'Creating your account...' : 'Signing in...');
      try {
        const r = await authPost(mode === 'signup' ? '/auth/signup' : '/auth/login', { username: name, password: pass });
        if (r.status === 200 && r.json.ok && r.json.token && r.json.username) {
          const session = { token: r.json.token, username: String(r.json.username).toLowerCase(), expiresAt: Number(r.json.expiresAt) || Date.now() + 29 * 86400000 };
          passInput.value = '';
          pass2Input.value = '';
          writeSession(session);
          root.remove();
          resolve(session);
          return;
        }
        say(r.json.error || `Something went wrong (code ${r.status}). Try again in a moment, and tell your teacher if it keeps happening.`, true);
      } catch (err) {
        say(err.message, true);
      } finally {
        busy = false;
        submitBtn.disabled = false;
      }
    }

    setMode('login');
    say(note || '');
    main.replaceChildren(root);
    userInput.focus();
  });
}

/** Sign out, or the server turned this sign-in down. Saves first, then starts over at the sign-in screen. */
async function endSession(note) {
  if (ending) return;
  ending = true;
  try {
    await flush();
  } catch {
    /* nothing more to do */
  }
  clearSession();
  try {
    if (note) sessionStorage.setItem(NOTE_KEY, note);
  } catch {
    /* fine */
  }
  location.reload();
}

/** True when the browser's saved sign-in is a different person than the one this tab loaded. */
function accountChangedElsewhere() {
  if (env.mode !== 'account') return false;
  const s = readSession();
  return !s || s.username !== auth.name;
}

/** Another tab signed in as someone else, or signed out. This tab must stop, so nothing lands in the wrong account. */
function watchSession() {
  window.addEventListener('storage', (e) => {
    if (e.key !== null && e.key !== SESSION_KEY) return;
    const now = readSession();
    if (now && now.username === auth.name) {
      auth.token = now.token;
      auth.expiresAt = now.expiresAt;
      return;
    }
    lockAccountTab(now ? 'other' : 'out');
  });
}

function lockAccountTab(why) {
  if (env.accountLocked) return;
  flush(); // save this person's work under their own name first
  env.accountLocked = true;
  env.readOnly = true;
  invalidateSession();
  document.body.classList.add('gated');
  main.replaceChildren(
    h('div', { class: 'page', id: 'account-changed', role: 'alert' },
      h('section', { class: 'panel' },
        h('h2', {}, why === 'other' ? 'Testr was opened as someone else in another tab' : 'You signed out in another tab'),
        h('p', {}, 'To keep each person\u2019s notes apart, this tab has stopped. Reload it to carry on as whoever is signed in now.'),
        h('div', { class: 'form-actions' }, h('button', { id: 'account-reload', class: 'btn btn--primary', type: 'button', onclick: () => location.reload() }, 'Reload this tab')),
      ),
    ),
  );
}

function accountPanel(b) {
  const msg = h('p', { class: 'hint', role: 'status' });
  const test = h('button', { class: 'btn btn--quiet', type: 'button', onclick: async () => {
    test.disabled = true;
    msg.replaceChildren(cupIcon('cup--steaming'), ' Testing');
    try {
      msg.textContent = (await testConnection()) ? 'Connected. The Testr server answered, so quizzes are ready to go.' : 'The server answered with an empty reply. Try once more.';
    } catch (e) {

    } finally {

  return h('section', { class: 'panel', 'aria-labelledby': 'conn-h' },
    h('h2', { id: 'conn-h' }, 'Your account'),

    h('div', { class: 'form-actions' }, test, h('button', { class: 'btn btn--quiet', type: 'button', onclick: () => endSession('You are signed out. Your notes stay on this computer.') }, 'Sign out'), msg),
