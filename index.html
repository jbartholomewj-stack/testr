const MODE_NAMES = {
  account: 'Testr is running as a web page. You sign in with a username and password, your notes and quizzes are saved in this browser under that username, and AI requests go through the Testr server.',
  worker: 'Testr is running as a web page. Your notes and quizzes are saved in this browser, and AI requests go through your own Cloudflare Worker.',
  extension: 'Testr is running as a Chrome extension. Your notes and quizzes are saved in this browser, and your token stays on this device.',
  server: 'Testr is running through server.py. Your notes and quizzes are saved in the data folder next to it, and your token stays in config.json.',
};

function renderSettings(root) {
  const page = h('div', { class: 'page' });
  root.replaceChildren(page);

  // ---- connection ----
  const worker = env.mode === 'worker';
  const accountInput = h('input', { id: 's-account', class: 'input', autocomplete: 'off', spellcheck: 'false', placeholder: accountHint() ? `Saved (${accountHint()})` : worker ? 'https://testr-ai.yourname.workers.dev' : 'Paste your Account ID' });
  const tokenInput = h('input', { id: 's-token', class: 'input', type: 'password', autocomplete: 'off', placeholder: isConfigured() ? 'Saved. Type a new one to replace it' : worker ? 'Your passphrase' : 'Paste your API token' });
  const connMsg = h('p', { class: 'hint', role: 'status' });
  const saveConn = h('button', { class: 'btn btn--primary', type: 'button', onclick: onSaveConn }, 'Save connection');
  const testBtn = h('button', { class: 'btn btn--quiet', type: 'button', onclick: onTest }, 'Test connection');

  async function onSaveConn() {
    const first = accountInput.value.trim();
    const second = tokenInput.value.trim();
    if (!first && !second) {
      connMsg.textContent = worker ? 'Paste the Worker address and your passphrase first.' : 'Paste an account ID and a token first.';
      return;
    }
    try {
      await saveConfig(worker ? { workerUrl: first, key: second } : { accountId: first, token: second });
      accountInput.value = '';
      tokenInput.value = '';
      accountInput.placeholder = accountHint() ? `Saved (${accountHint()})` : accountInput.placeholder;
      tokenInput.placeholder = 'Saved. Type a new one to replace it';
      connMsg.textContent = isConfigured() ? 'Saved. Press Test connection to check that it works.' : worker ? 'Saved. Testr still needs both the Worker address and the passphrase.' : 'Saved. Testr still needs both the account ID and the token.';
      notifyChanged();
    } catch (e) {
      connMsg.textContent = friendlyError(e);
    }
  }

  async function onTest() {
    if (!isConfigured()) {
      connMsg.textContent = worker ? 'Save your Worker address and passphrase first.' : 'Save your account ID and token first.';
      return;
    }
    testBtn.disabled = true;
    connMsg.replaceChildren(cupIcon('cup--steaming'), ' Testing');
    try {
      const reply = await testConnection();
      connMsg.textContent = reply ? 'Connected. Cloudflare answered, so quizzes are ready to go.' : 'Cloudflare answered with an empty reply. Try once more.';
    } catch (e) {
      connMsg.textContent = friendlyError(e);
    } finally {

  const workerCodeBox = h('textarea', { class: 'input code-box', readonly: true, rows: 8, 'aria-label': 'Worker code', value: WORKER_CODE });

  const copyBtn = h('button', { class: 'btn btn--small btn--quiet', type: 'button', onclick: async () => {
    try {
      await navigator.clipboard.writeText(WORKER_CODE);
      copyMsg.textContent = 'Copied.';
    } catch {
      workerCodeBox.focus();
      workerCodeBox.select();
      copyMsg.textContent = 'Press Ctrl+C to copy the selected code.';
    }
  } }, 'Copy the Worker code');

  const steps = worker
    ? h(
        'ol',
        { class: 'steps' },
        h('li', {}, 'Make a free account at dash.cloudflare.com. No card is needed for the free plan.'),
        h('li', {}, 'Open Workers & Pages, press Create, then Create Worker. Name it testr-ai and press Deploy.'),
        h('li', {}, 'Press Edit code, select everything, paste the Worker code (copy it with the button below), and press Deploy.'),
        h('li', {}, 'Open the Worker\u2019s Settings, then Bindings, then Add. Choose Workers AI and name it AI (capital letters).'),
        h('li', {}, 'Still in Settings, open Variables and Secrets, add a Secret named TESTR_KEY, and make the value a passphrase only you know. Deploy again.'),
        h('li', {}, 'Copy the Worker\u2019s address (it ends in workers.dev) and paste it below with your passphrase.'),
      )
    : h(
        'ol',
        { class: 'steps' },
        h('li', {}, 'Make a free account at dash.cloudflare.com. No card is needed for the free plan.'),
        h('li', {}, 'In the left menu open AI, then Workers AI, and press Use REST API.'),
        h('li', {}, 'Copy the Account ID shown there and paste it below.'),
        h('li', {}, 'Press Create a Workers AI API token, create it, and paste the token below. Cloudflare shows it only once.'),
      );

  // ---- quiz defaults ----
  const level = h('select', { id: 's-level', class: 'select', value: state.settings.difficulty, onchange: () => update({ difficulty: level.value }) }, ['easy', 'medium', 'hard'].map((l) => h('option', { value: l }, cap(l))));
  const count = h('input', { id: 's-count', class: 'input input--short', type: 'number', min: 5, max: 15, value: state.settings.count, onchange: () => {
    count.value = clampInt(count.value, 5, 15, 10);
    update({ count: Number(count.value) });
  } });
  const timerOn = h('input', { id: 's-timer', type: 'checkbox', checked: state.settings.timerOn, onchange: () => update({ timerOn: timerOn.checked }) });
  const minutes = h('input', { id: 's-min', class: 'input input--short', type: 'number', min: 5, max: 60, value: state.settings.minutes, onchange: () => {
    minutes.value = clampInt(minutes.value, 5, 60, 15);
    update({ minutes: Number(minutes.value) });
  } });
  function update(patch) {
    Object.assign(state.settings, patch);
    save();
    toast('Saved.', { ms: 1800 });
  }

  // ---- models ----
  const modelInputs = {};
  const modelRows = [
    ['write', 'Writes questions and grades first'],
    ['check', 'Checks answer keys and takes the second look'],
    ['vision', 'Reads photos of notes'],
  ].map(([role, text]) => {

  async function onRestore() {

      go('#/today');

    h('div', { class: 'page-head' }, h('h2', { class: 'page-title' }, 'Settings'), h('p', { class: 'sub' }, MODE_NAMES[env.mode])),
    ...(!env.canSave ? [cantSaveNotice()] : []),
    ...(env.saveError ? [h('div', { class: 'notice notice--error', role: 'alert' }, h('div', { class: 'notice-text' }, h('strong', {}, env.saveError), h('p', {}, 'Download a backup below so nothing is lost.')))] : []),

    env.mode === 'account' ? accountPanel(b) : h(
      'section',
      { class: 'panel', 'aria-labelledby': 'conn-h' },
      h('h2', { id: 'conn-h' }, worker ? 'Cloudflare Worker' : 'Cloudflare connection'),
      h('p', { class: 'status-line' }, isConfigured() ? `Saved connection: ${accountHint() || 'ready'}. ${budgetSentence(b)}` : 'Not connected yet.'),

// ---- view-quiz.js ----







const missing = () =>
  h('div', { class: 'page' }, emptyBox('That quiz is not here anymore.', 'It may have been removed. Your other quizzes are on the Today page.', h('a', { class: 'btn btn--primary', href: '#/today' }, 'Back to Today')));

const isAnswered = (q, a) => (q.type === 'mcq' ? Number.isInteger(a) : q.type === 'tf' ? typeof a === 'boolean' : typeof a === 'string' && a.trim().length > 0);

function answerText(q, a) {
  if (q.type === 'mcq') return Number.isInteger(a) ? q.options[a] : 'No answer';
  if (q.type === 'tf') return typeof a === 'boolean' ? (a ? 'True' : 'False') : 'No answer';
  return typeof a === 'string' && a.trim() ? a.trim() : 'No answer';
}
const keyText = (q) => (q.type === 'mcq' ? q.options[q.answerIndex] : q.type === 'tf' ? (q.answer ? 'True' : 'False') : q.answer);

// ---- taking the quiz ---------------------------------------------------------------------
function renderQuiz(root, id) {
  const quiz = quizById(id);
  if (!quiz) {
    root.replaceChildren(missing());
    return;
  }
  if (quiz.attempt) {
    go(`#/results/${id}`, { replace: true });
    return;
  }
  if (!quiz.draft) {
    quiz.draft = { answers: {}, startedAt: Date.now() };
    save();
  }
  const draft = quiz.draft;
  const total = quiz.questions.length;

  const progress = h('span', { class: 'quiz-progress' });
  const timer = h('span', { class: 'quiz-timer', role: 'timer' });
  const status = h('p', { class: 'quiz-status', role: 'status' });
  const submit = h('button', { class: 'btn btn--primary btn--big', type: 'button', onclick: turnIn }, 'Turn in quiz');

  const updateProgress = () => {
    const done = quiz.questions.filter((q) => isAnswered(q, draft.answers[q.id])).length;
    progress.textContent = `${done} of ${total} answered`;
  };
  const onAnswer = (qid, value) => {
    draft.answers[qid] = value;
    save();
    updateProgress();
  };

  const tick = () => {
    if (!state.settings.timerOn) {
      timer.textContent = '';
      return;
    }
    const left = state.settings.minutes * 60 - Math.floor((Date.now() - draft.startedAt) / 1000);
    const m = Math.floor(Math.abs(left) / 60);
    const s = String(Math.abs(left) % 60).padStart(2, '0');
    timer.textContent = left >= 0 ? `${m}:${s} left` : `Over by ${m}:${s}`;
    timer.classList.toggle('is-over', left < 0);
  };
  const interval = setInterval(tick, 1000);

  let alive = true; // false once the person leaves this page

  /** Follow a grading job: go to the results if we are still here, otherwise leave a quiet note. */
  function watch(pending) {
    submit.disabled = true;
    pending.then(
      () => {
        if (alive) go(`#/results/${quiz.id}`);
        else toast(`Your ${quiz.className} quiz was checked.`, { actionLabel: 'See results', onAction: () => go(`#/results/${quiz.id}`) });
      },
      (e) => {
        if (alive) {
          status.textContent = '';
          submit.disabled = false;
        }
        toast(friendlyError(e), { kind: 'error', actionLabel: alive ? undefined : 'Open quiz', onAction: () => go(`#/quiz/${quiz.id}`) });
      },
    );
  }

  async function turnIn() {
    const blank = quiz.questions.filter((q) => !isAnswered(q, draft.answers[q.id])).length;
    if (blank && !(await confirmBox(`${plural(blank, 'question')} still blank. Turn in anyway?`, { yes: 'Turn in' }))) return;
    status.textContent = 'Checking your answers';
    watch(submitQuiz(quiz, { onStep: (text) => { if (alive) status.textContent = text; } }));
  }

  const list = h(
    'ol',
    { class: 'qlist' },
    quiz.questions.map((q, i) => questionCard(q, i, draft, onAnswer)),
  );

  root.replaceChildren(
    h(
      'div',
      { class: 'page page--quiz' },
      h(
        'div',
        { class: 'quiz-bar' },
        h('div', {}, h('h2', { class: 'quiz-title' }, quiz.className), h('p', { class: 'sub' }, `${cap(quiz.difficulty)} level, ${fmtDay(quiz.date)}`)),
        h('div', { class: 'quiz-meta' }, progress, timer),
      ),
      h('div', { class: 'sheet' }, list, h('div', { class: 'quiz-submit' }, submit, status)),
      h('p', { class: 'hint center' }, h('a', { class: 'link', href: '#/today' }, 'Leave for now'), '. Your answers are saved as you go.'),
    ),
  );
  updateProgress();
  tick();
  const inProgress = gradingFor(quiz.id); // came back to a quiz that is still being checked
  if (inProgress) {
    status.textContent = 'Checking your answers';
    watch(inProgress);
  }
  return () => {
    alive = false;
    clearInterval(interval);
  };
}

/** Show, key idea by key idea, what was found in the student's own words. */
function checklistView(list) {
  const label = { covered: 'Covered', missing: 'Missing', wrong: 'Contradicted' };
  return h(
    'ul',
    { class: 'checklist', 'aria-label': 'Key ideas in this question' },
    list.map((c) =>
      h('li', { class: `check check--${c.status}` }, h('span', { class: 'check-label' }, label[c.status]), ' ', h('span', { class: 'check-idea' }, c.idea), c.quote ? h('span', { class: 'check-quote' }, ` You wrote: \u201c${c.quote}\u201d`) : null),
    ),
  );
}

function optionRow(name, label, checked, onPick) {
  return h('label', { class: 'opt' }, h('input', { type: 'radio', name, checked, onchange: onPick }), h('span', { class: 'opt-text' }, label));
}

function questionCard(q, i, draft, onAnswer) {
  const name = `q-${q.id}`;
  const labelId = `${name}-t`;
  let input;
  if (q.type === 'mcq') {
    input = h('div', { class: 'opts', role: 'radiogroup', 'aria-labelledby': labelId }, q.options.map((o, j) => optionRow(name, o, draft.answers[q.id] === j, () => onAnswer(q.id, j))));
  } else if (q.type === 'tf') {
    input = h(
      'div',
      { class: 'opts opts--row', role: 'radiogroup', 'aria-labelledby': labelId },
      [true, false].map((v) => optionRow(name, v ? 'True' : 'False', draft.answers[q.id] === v, () => onAnswer(q.id, v))),
    );
  } else {
    input = h('textarea', {
      class: 'input input--paper',
      rows: 3,
      placeholder: 'Answer in a sentence or two',
      'aria-labelledby': labelId,
      value: draft.answers[q.id] || '',
      oninput: (e) => onAnswer(q.id, e.target.value),
    });
  }
  return h('li', { class: 'qcard' }, h('p', { class: 'qtext', id: labelId }, h('span', { class: 'qnum' }, `${i + 1}.`), ' ', q.question), input);
}

// ---- results --------------------------------------------------------------------------------------
function renderResults(root, id) {
  const quiz = quizById(id);
  if (!quiz) {
    root.replaceChildren(missing());
    return;
  }
  if (!quiz.attempt) {
    go(`#/quiz/${id}`, { replace: true });
    return;
  }

  const att = quiz.attempt;
  const page = h('div', { class: 'page page--quiz' });
  root.replaceChildren(page);

  const draw = () => {
    const a = quiz.attempt;
    const notes = [];
    if (a.rechecked) {
      notes.push(`${plural(a.rechecked, 'written answer')} marked down got a second look${a.overturned ? `, and ${a.overturned} ${a.overturned === 1 ? 'was' : 'were'} changed in your favor` : ''}.`);
    }
    if (quiz.unverified) notes.push('The answer key for this quiz could not be double-checked when it was made.');
    page.replaceChildren(
      h(
        'div',
        { class: 'sheet score' },
        h('h2', { class: 'quiz-title' }, quiz.className),
        h('p', { class: 'score-line' }, `You got ${fmtScore(a.score)} of ${a.total} (${a.percent}%)`),
        h('p', { class: 'sub' }, `${cap(quiz.difficulty)} level, ${fmtDay(quiz.date)}${a.seconds ? `, ${Math.max(1, Math.round(a.seconds / 60))} min` : ''}`),
        notes.map((n) => h('p', { class: 'score-note' }, n)),
        h('div', { class: 'score-actions' }, h('a', { class: 'btn btn--ink', href: '#/today' }, 'Back to Today'), h('a', { class: 'btn btn--quiet-ink', href: `#/notes?class=${encodeURIComponent(quiz.className)}` }, 'Add more notes')),
      ),
      h('ol', { class: 'review' }, quiz.questions.map((q, i) => reviewCard(q, i, a, draw))),
    );
  };
  draw();

  function reviewCard(q, i, a, redraw) {
    const res = a.results[q.id] || { verdict: 'incorrect', points: 0, feedback: '' };
    const kind = res.verdict === 'correct' ? 'ok' : res.verdict === 'partial' ? 'part' : 'no';
    const label = res.voided ? 'Credited' : res.verdict === 'correct' ? 'Correct' : res.verdict === 'partial' ? 'Partly right' : 'Not quite';
    const card = h('li', { class: `rcard rcard--${kind}` });
    card.append(
      h('div', { class: 'rhead' }, h('span', { class: `badge badge--${kind}` }, label), res.rechecked && res.overturned ? h('span', { class: 'badge badge--info' }, 'Changed on re-check') : null),
      h('p', { class: 'qtext' }, h('span', { class: 'qnum' }, `${i + 1}.`), ' ', q.question),
      h('p', { class: 'ans' }, h('span', { class: 'ans-label' }, 'Your answer: '), answerText(q, a.answers[q.id])),
    );
    if (res.verdict !== 'correct') card.append(h('p', { class: 'ans' }, h('span', { class: 'ans-label' }, 'Correct answer: '), keyText(q)));
    const hasChecklist = q.type === 'short' && Array.isArray(res.checklist) && res.checklist.length > 0;
    if (hasChecklist) card.append(checklistView(res.checklist));
    const why = hasChecklist ? '' : res.feedback || (res.verdict !== 'correct' ? q.explanation : '');
    if (why) card.append(h('p', { class: 'why' }, h('span', { class: 'ans-label' }, res.verdict === 'correct' ? 'Note: ' : 'Why: '), why));
    if (res.verdict !== 'correct' && q.explanation && res.feedback && res.feedback !== q.explanation && q.type === 'short') {
      card.append(h('p', { class: 'why' }, h('span', { class: 'ans-label' }, 'From your notes: '), q.explanation));
    }
    if (res.verdict !== 'correct' && !res.disputed && !quiz.sourceText) card.append(h('p', { class: 'hint' }, 'This quiz is too old for a second look.'));
    else if (res.verdict !== 'correct' && !res.disputed) card.append(disputeBox(q, redraw));
    else if (res.disputed && res.verdict !== 'correct') card.append(h('p', { class: 'hint' }, 'Testr already took a second look at this one and kept the grade.'));
    return card;
  }

  function disputeBox(q, redraw) {
    const box = h('div', { class: 'dispute' });
    const open = h('button', { class: 'btn btn--small btn--quiet-ink', type: 'button', onclick: show }, 'I think I was right');
    box.append(open);
    function show() {
      const why = h('textarea', { class: 'input input--paper', rows: 2, placeholder: 'Optional: tell Testr why your answer should count' });
      const askBtn = h('button', { class: 'btn btn--small btn--ink', type: 'button', onclick: run }, 'Ask for another look');
      const cancel = h('button', { class: 'btn btn--small btn--quiet-ink', type: 'button', onclick: () => box.replaceChildren(open) }, 'Cancel');
      const msg = h('span', { class: 'hint', role: 'status' });
      box.replaceChildren(why, h('div', { class: 'dispute-actions' }, askBtn, cancel, msg));
      why.focus();
      async function run() {
        askBtn.disabled = true;
        cancel.disabled = true;
        msg.append(cupIcon('cup--steaming'), ' Looking again');
        try {
          await disputeQuestion(quiz, q.id, why.value);
          redraw();
        } catch (e) {
          toast(friendlyError(e), { kind: 'error' });
          box.replaceChildren(open);
        }
      }
    }
    return box;
  }
}

// ---- app.js ----













const main = document.getElementById('main');
let cleanup = null;

const safeDecode = (v) => {
  try {
    return decodeURIComponent(v);
  } catch {
    return v; // a damaged address must not stop Testr from starting
  }
};

function parseHash(hash) {
  const raw = String(hash || '').replace(/^#\/?/, '');
  const [path, query = ''] = raw.split('?');
  const [name = 'today', arg = ''] = path.split('/');
  return { name: name || 'today', arg: safeDecode(arg), params: new URLSearchParams(query) };
}

const ROUTES = {
  today: () => renderToday(main),
  notes: ({ params }) => renderNotes(main, params),
  week: () => renderWeek(main),
  history: () => renderHistory(main),
  progress: () => renderProgress(main),
  settings: () => renderSettings(main),
  quiz: ({ arg }) => renderQuiz(main, arg),
  results: ({ arg }) => renderResults(main, arg),
};
// quiz and results pages belong to Today in the top menu
const NAV_OF = { quiz: 'today', results: 'today' };

let shownDay = localDate();

/** Tab came back to the front: if the day changed while it sat open, show the new day and make its quizzes. */
function onResumeVisible() {
  if (localDate() !== shownDay) {
    shownDay = localDate();
    const hash = currentHash() || '#/today';
    if (parseHash(hash).name === 'today') route(hash);
  }
  ensureDaily();
}

function route(hash) {
  if (env.accountLocked) return; // this tab stopped because the account changed
  shownDay = localDate();
  if (cleanup) {
    try {
      cleanup();
    } catch (e) {
      console.error(e);
    }
    cleanup = null;
  }
  const r = parseHash(hash);
  const name = ROUTES[r.name] ? r.name : 'today';
  const active = NAV_OF[name] || name;
  document.querySelectorAll('#nav a').forEach((a) => {
    if (a.dataset.route === active) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });
  try {
    cleanup = ROUTES[name](r) || null;
  } catch (e) {
    console.error(e);
    main.replaceChildren(h('div', { class: 'page' }, h('div', { class: 'notice notice--error', role: 'alert' }, h('div', { class: 'notice-text' }, h('strong', {}, 'This page hit a problem.'), h('p', {}, 'The other pages should still work. If it keeps happening, restore a backup or erase everything in Settings. Details: ' + String(e && e.message ? e.message : e))), h('div', { class: 'notice-actions' }, h('a', { class: 'btn btn--primary', href: '#/today' }, 'Go to Today'), h('a', { class: 'btn btn--quiet', href: '#/settings' }, 'Open Settings')))));
  }
  if (name === 'today') ensureDaily(); // a tab left open overnight still makes the new day's quizzes
  window.scrollTo(0, 0);
}

function makeRain() {
  const rain = document.getElementById('rain');
  for (let i = 0; i < 44; i++) {
    const drop = document.createElement('i');
    drop.style.setProperty('--x', `${Math.random() * 100}%`);
    drop.style.setProperty('--len', `${10 + Math.random() * 16}px`);
    drop.style.setProperty('--t', `${0.9 + Math.random() * 0.9}s`);
    drop.style.setProperty('--d', `${-Math.random() * 2}s`);
    rain.append(drop);
  }
}

// Every link that points at a Testr page switches pages in the app itself,
// so the menu and buttons work even where the browser blocks changes to the address.
function handleLinks(e) {
  const a = e.target.closest && e.target.closest('a[href]');
  if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  const href = a.getAttribute('href') || '';
  if (href.startsWith('#/')) {
    e.preventDefault();
    go(href);
  } else if (href === '#main') {
    e.preventDefault();
    main.focus();
  }
}

async function begin() {
  window.__testrStarted = true;
  setRenderer(route);
  document.addEventListener('click', handleLinks);
  document.getElementById('signout').addEventListener('click', () => endSession('You are signed out. Your notes stay on this computer and are here when you sign back in.'));
  document.getElementById('brand-cup').append(cupIcon());
  makeRain();
  mountBrewBanner(document.getElementById('brew'));
  // Only one tab may change the data. If another tab is open, wait here until the person chooses this one.
  await claimActiveTab({
    showMessage: showTakeover,
    hideMessage: hideTakeover,
    onResume: async () => {
      // this tab was paused and is taking over again: pick up whatever the other tab saved
      if (accountChangedElsewhere()) {
        location.reload(); // someone else signed in meanwhile: start again as them
        return;
      }
      await reloadStore();
      dailyErrors.clear();
      route(currentHash() || '#/today');
    },
    afterResume: () => ensureDaily(),
  });
  await detectMode();
  if (env.mode === 'account') {
    await signInGate();
    watchSession();
  }
  await loadStore();

  window.addEventListener('popstate', showFromBrowser);
  window.addEventListener('hashchange', showFromBrowser);
  window.addEventListener('testr:save-error', () => toast('Testr could not save your latest changes. Download a backup from Settings.', { kind: 'error', ms: 0 }));
  window.addEventListener('pagehide', () => flush());
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') flush();
    else onResumeVisible();
  });

  startNav(readHash() || '#/today');
  window.__testrRendered = true;
  ensureDaily(); // make today's quizzes the first time Testr opens each day
}

begin().catch((e) => {
  console.error(e);
  main.replaceChildren(h('div', { class: 'page' }, h('div', { class: 'notice notice--error', role: 'alert' }, h('div', { class: 'notice-text' }, h('strong', {}, 'Testr could not start.'), h('p', {}, String(e && e.message ? e.message : e))))));
});

})();
  </script>
